appId: com.codefly.desktop
productName: CodeFly
artifactName: ${productName}-Setup-${version}-${os}-${arch}.${ext}
npmRebuild: false
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
