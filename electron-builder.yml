appId: com.codefly.desktop
productName: CodeFly
artifactName: ${productName}-Setup-${version}-${os}-${arch}.${ext}
npmRebuild: false
# Package from the Electron binaries npm already installed instead of letting
# electron-builder download its own copy: it unpacks that copy into
# release/win-unpacked.tmp and renames it, and on Windows the rename is refused
# (EPERM) whenever a security scanner still holds the freshly written exe/dlls.
# node_modules/electron/dist is the same official build as the devDependency this
# config is packaged with, so reusing it skips the download, the unpack, and the
# rename that kept failing.
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  # App bundles, not installers, so no "Setup" in the name.
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  # These targets apply on a macOS host (`npx electron-builder --mac`). dmg needs
  # hdiutil, so `npm run package:mac` (Linux container, see scripts/package-mac.mjs)
  # overrides them from the CLI with `dir` and zips the bundle itself: 7-Zip, which
  # electron-builder uses for zip off macOS, dereferences the symlinks inside
  # Electron Framework.framework and triples the bundle size.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  files:
    # node-pty ships prebuilt binaries for every platform. The Windows ones, the
    # build/ tree its Windows postinstall populates and the bundled ConPTY
    # binaries are dead weight in a macOS bundle. prebuilds/darwin-* stay: node-pty
    # resolves prebuilds/<platform>-<arch>/ at runtime and execs spawn-helper from
    # there (asarUnpack above keeps it on disk).
    - "!node_modules/node-pty/build/**"
    - "!node_modules/node-pty/prebuilds/win32-*/**"
    - "!node_modules/node-pty/third_party/**"
