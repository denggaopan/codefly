<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
  <title>CodeFly mobile app icon - white rocket on a purple ground</title>
  <!-- Parked here for a future mobile app, not used by the desktop build.

       The desktop icon is a transparent purple silhouette, which is what a Windows shortcut
       and a macOS dock want. Phones want the opposite: iOS and Android both hand you a
       square, fully opaque canvas and apply their own mask, so the artwork has to bring its
       own ground. This is that version - a white rocket on the brand purple - drawn edge to
       edge with no rounding of its own, because the platform rounds it:
       - iOS wants 1024x1024, fully opaque, NO alpha channel at all, and squircles it itself.
         A PNG exported from this file still carries an all-255 alpha channel; flatten it to
         RGB before submitting (e.g. `magick in.png -alpha off out.png`).
       - Android adaptive icons want this as the background/foreground pair on a 108dp canvas
         where only the middle 72dp shows and the middle 66dp is safe. The rocket spans ~59%
         of the canvas, so it clears that safe area.
       Somewhere that needs the rounding baked into the image instead (web favicon, store
       listing, mockup)? Add rx="230" ry="230" to the rect - 22.5% of the canvas, the same
       corner ratio the icon was designed with - and re-export.

       The rocket scales to 60% and is translated so its bounding box - x 21.57..1023.56,
       y 0.01..993.18, which is not symmetric in the 1024 box - lands centred on (512, 512).
       It is one path with three subpaths under the nonzero fill-rule:
       1. the exhaust dash below the rocket,
       2. the rocket body (clockwise, so it fills),
       3. the porthole (counter-clockwise, so it punches a hole).
       The porthole is the source artwork's "U" slot rotated 90 degrees clockwise about its
       own centre (662.766673, 360.937233) so the negative space reads as a "C" for CodeFly.
       Punching rather than painting it is what lets the ground show through the "C", so keep
       the transform on the element rather than on a subpath. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6fe0" />
      <stop offset="1" stop-color="#5b34a8" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#ground)" />
