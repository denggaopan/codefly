<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <title>CodeFly Logo - Rocket with a "C" porthole</title>
  <!-- One path, three subpaths, nonzero fill-rule:
       1. the exhaust dash below the rocket,
       2. the rocket body (clockwise, so it fills),
       3. the porthole (counter-clockwise, so it punches a hole).
       The porthole is the source artwork's "U" slot rotated 90 degrees clockwise about its
       own centre (662.766673, 360.937233) so the negative space reads as a "C" for CodeFly.
       The path is drawn edge to edge in its 1024-unit box, which made the desktop shortcut
       look oversized next to other Windows app icons (their artwork keeps a margin inside
       the icon slot). The transform scales the whole path to 85% about the box centre
       (512, 512), leaving a 7.5% margin on every side. It sits on the element, not on a
       subpath, so the nonzero fill-rule and the punched-out porthole are untouched.

       The fill is #9d4edd, not the #6e5494 that styles.css mirrors in its accent token.
       Brand purple at 27% saturation and 45% lightness is what made the shortcut hard to
       pick out: on a transparent ground the icon has no ground of its own, so a mid-dark
       silhouette against a dark wallpaper has almost no contrast left. #9d4edd keeps the
       purple but at 68% saturation and 58% lightness, which carries on a dark wallpaper and
       a dark taskbar while still reading against a light desktop.
       The accent token deliberately stays #6e5494: that is the UI's functional colour, and
       this is the brand mark. src/renderer/src/assets/logo.svg tracks THIS colour, not the
       accent, so the taskbar icon and the title-bar mark stay the same purple.

       A filled rounded tile (white rocket on purple) was tried and rejected for the desktop
       - a rectangle is not wanted here. That treatment is parked in design/mobile-app-icon.svg
       for a future mobile app, where the platform hands you an opaque square anyway.

       icon.png and icon.ico are rasterised from this file (Chromium canvas); regenerate
       both whenever it changes. -->
  <path
