       M1023.562731 49.032969v143.632126a535.801755 535.801755 0 0 1-157.848276 381.384964l-122.062797 122.062797-28.92251 202.457571a123.043221 123.043221 0 0 1-34.805054 69.119897l-34.805055 34.805054a73.531805 73.531805 0 0 1-103.924951 0l-294.127222-294.127221-104.415164 103.434739a49.021204 49.021204 0 0 1-69.119897-69.610109L177.456757 637.287412 21.56933 482.380408a73.531805 73.531805 0 0 1 0-103.924951L56.374384 343.16019a123.043221 123.043221 0 0 1 69.119897-34.314842l202.457571-28.92251 122.062797-122.062797A535.801755 535.801755 0 0 1 833.360461 0.011765h143.632126a49.021204 49.021204 0 0 1 46.570144 49.021204z
       m-256.741697 415.829216a49.021204 49.021204 0 0 0-69.119897-69.119897 49.021204 49.021204 0 0 1-69.610109 0 49.021204 49.021204 0 0 1 0-69.119897 49.021204 49.021204 0 0 1 69.610109 0 49.021204 49.021204 0 0 0 69.119897-69.610109 147.063611 147.063611 0 1 0 0 207.849903z"
