<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <title>CodeFly Logo - Rocket with a "C" porthole</title>
  <!-- One path, three subpaths, nonzero fill-rule:
       1. the exhaust dash below the rocket,
       2. the rocket body (clockwise, so it fills),
       3. the porthole (counter-clockwise, so it punches a hole).
       The porthole is the source artwork's "U" slot rotated 90 degrees clockwise about its
       own centre (662.766673, 360.937233) so the negative space reads as a "C" for CodeFly.
       The path is drawn edge to edge in its 1024-unit box, which made the desktop shortcut
       look oversized next to other Windows app icons (their artwork keeps a margin inside
       the icon slot). The transform scales the whole path to 85% about the box centre
       (512, 512), leaving a 7.5% margin on every side. It sits on the element, not on a
       subpath, so the nonzero fill-rule and the punched-out porthole are untouched.

       Depth: the mark used to be one flat #9d4edd, which read as a sticker rather than an
       object. It now carries a diagonal gradient plus a cast shadow - the most restrained
       of the four treatments that were rendered side by side, and the one that was picked.
       Deliberately NOT chosen: a 2.5D extrude (thickens the outline), a specular bevel
       (moulded-plastic sheen), and a hard-diagonal two-tone fold. All three change how the
       silhouette itself reads; this one leaves the outline byte-identical and only changes
       what is inside it, which is the point - the silhouette is the brand mark.

       The gradient runs top-left #c77dff -> #9d4edd -> bottom-right #6a2ca8, i.e. a light
       source off the top left, which is also where the cast shadow is thrown from. #9d4edd
       stays the midpoint so the icon's overall colour is unchanged from the flat version:
       it is the value that made the shortcut readable on a dark wallpaper (27%-saturation
       #6e5494 did not) and it stays the colour the title-bar mark tracks.
       The accent token in styles.css deliberately stays #6e5494: that is the UI's functional
       colour, and this is the brand mark.

       Shadow geometry is tighter than it looks: the scaled path ends at x=946.8 and y=921,
       and the shadow reaches dx + 3*stdDeviation = 76 units past that, landing at x=1022.8 -
       1.2 units inside the viewBox. Growing dx or stdDeviation clips the shadow against the
       right edge, so change them together with the 85% scale, not on their own.

       A filled rounded tile (white rocket on purple) was tried and rejected for the desktop
       - a rectangle is not wanted here. That treatment is parked in design/mobile-app-icon.svg
       for a future mobile app, where the platform hands you an opaque square anyway.

       icon.png and icon.ico are rasterised from this file by scripts/rasterize-icons.mjs;
       run it whenever this file changes. -->
  <defs>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#c77dff" />
      <stop offset="0.5" stop-color="#9d4edd" />
      <stop offset="1" stop-color="#6a2ca8" />
    </linearGradient>
    <filter id="cast" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="10" dy="18" stdDeviation="22" flood-color="#1a0630" flood-opacity="0.55" />
    </filter>
  </defs>
